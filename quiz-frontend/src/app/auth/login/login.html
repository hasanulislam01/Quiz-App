<main class="login-page">
      <div class="background-shape shape-one"></div>
      <div class="background-shape shape-two"></div>

      <section class="login-wrapper">
        <div class="brand-section">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 3L20 7V12C20 17 16.5 20 12 22C7.5 20 4 17 4 12V7L12 3Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path
                d="M8.5 12L10.8 14.3L15.8 9.3"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>

          <h1>Welcome back<span>.</span></h1>
          <p>Sign in to continue to your account.</p>
        </div>

        <div class="login-card">
          <div class="card-heading">
            <h2>Sign in</h2>
            <p>Enter your credentials below to get started.</p>
          </div>

          <form (ngSubmit)="submit()" #loginForm="ngForm">
            <div class="form-group">
              <label for="email">Email address</label>

              <div class="input-wrapper">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="3"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                  <path
                    d="M4 7L12 13L20 7"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>

                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="you@example.com"
                  [(ngModel)]="email"
                  required
                  email
                  autocomplete="email"
                />
              </div>
            </div>

            <div class="form-group">
              <div class="label-row">
                <label for="password">Password</label>
              </div>

              <div class="input-wrapper">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect
                    x="5"
                    y="10"
                    width="14"
                    height="11"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                  <path
                    d="M8 10V7A4 4 0 0 1 16 7V10"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />
                  <circle cx="12" cy="15" r="1.2" fill="currentColor"/>
                </svg>

                <input
                  id="password"
                  name="password"
                  [type]="showPassword() ? 'text' : 'password'"
                  placeholder="Enter your password"
                  [(ngModel)]="password"
                  required
                  autocomplete="current-password"
                />

                <button
                  class="password-toggle"
                  type="button"
                  (click)="togglePassword()"
                  [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                >
                  @if (showPassword()) {
                    <svg viewBox="0 0 24 24" fill="none">
                      <path
                        d="M3 3L21 21M10.6 10.6A2 2 0 0 0 13.4 13.4"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                      />
                      <path
                        d="M9.9 5.2A10.8 10.8 0 0 1 12 5C17 5 20 12 20 12A15 15 0 0 1 17 16"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                      />
                      <path
                        d="M6.2 6.2C4.1 7.7 3 12 3 12S6 19 12 19C13.4 19 14.6 18.6 15.7 17.9"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                      />
                    </svg>
                  } @else {
                    <svg viewBox="0 0 24 24" fill="none">
                      <path
                        d="M2.5 12S6 5 12 5S21.5 12 21.5 12S18 19 12 19S2.5 12 2.5 12Z"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                      />
                      <circle
                        cx="12"
                        cy="12"
                        r="3"
                        stroke="currentColor"
                        stroke-width="1.7"
                      />
                    </svg>
                  }
                </button>
              </div>
            </div>

            @if (error()) {
              <div class="error-message" role="alert">
                <span>!</span>
                {{ error() }}
              </div>
            }

            <button
              class="submit-button"
              type="submit"
              [disabled]="loading() || loginForm.invalid"
            >
              @if (loading()) {
                <span class="spinner"></span>
                Signing in...
              } @else {
                Sign in to your account
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M5 12H19M12 5L19 12L12 19"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              }
            </button>
          </form>

          <div class="register-section">
            <span>Don't have an account?</span>
            <a routerLink="/register">Create an account</a>
          </div>
        </div>

        <footer class="login-footer">
          <span class="footer-dot"></span>
          Secure authentication
          <span class="footer-divider">·</span>
          Your account, protected
        </footer>
      </section>
    </main>
